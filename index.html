<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logistics AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f12;
      --surface: #161a1f;
      --border: #232830;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --text: #05080c;
      --muted: #64748b;
      --user-bg: #1a2236;
      --bot-bg: #121820;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    header .subtitle {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .status-dot {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .status-dot::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    /* ── Main layout ── */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    aside {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      gap: 8px;
    }

    aside .section-label {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .sample-btn {
      text-align: left;
      padding: 9px 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12.5px;
      font-family: var(--sans);
      cursor: pointer;
      line-height: 1.4;
      transition: border-color 0.15s, background 0.15s;
    }

    .sample-btn:hover {
      border-color: var(--accent);
      background: #0d1922;
    }

    /* ── Chat area ── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 4px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 40px;
      gap: 12px;
    }

    .welcome .icon {
      font-size: 40px;
    }

    .welcome h2 {
      font-size: 20px;
      font-weight: 400;
    }

    .welcome p {
      font-size: 13px;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.6;
    }

    .welcome code {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      background: #0d1922;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 820px;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      flex-direction: row-reverse;
      margin-left: auto;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .msg.user .avatar {
      background: var(--user-bg);
      border: 1px solid #2d3a52;
    }

    .msg.bot .avatar {
      background: linear-gradient(135deg, #0d3040, #1a1040);
      border: 1px solid var(--border);
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.65;
      max-width: 680px;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid #2d3a52;
      color: #b8d4ff;
      font-family: var(--mono);
      font-size: 13px;
    }

    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
    }

    .bubble .meta {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 8px;
    }

    /* Thinking indicator */
    .thinking .bubble {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 11px 15px;
    }

    .dot-row {
      display: flex;
      gap: 4px;
    }

    .dot-row span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }

    .dot-row span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot-row span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    .thinking-label {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── Input bar ── */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #question {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
    }

    #question:focus {
      border-color: var(--accent);
    }

    #question::placeholder {
      color: var(--muted);
    }

    #send-btn {
      width: 42px;
      height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    #send-btn:hover {
      opacity: 0.88;
    }

    #send-btn:active {
      transform: scale(0.95);
    }

    #send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 18px;
      height: 18px;
      fill: #000;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">📦</div>
    <div>
      <h1>Logistics AI Agent</h1>
      <div class="subtitle">LangChain · Groq · SQLite · FastAPI</div>
    </div>
    <div class="status-dot" id="status-text">connected</div>
  </header>

  <div class="container">
    <!-- Sidebar: sample questions loaded from /sample-questions -->
    <aside>
      <div class="section-label">Sample questions</div>
      <div id="sample-list">
        <div style="font-size:12px;color:var(--muted);">Loading…</div>
      </div>
    </aside>

    <!-- Chat -->
    <div class="chat-wrap">
      <div id="messages">
        <div class="welcome" id="welcome">
          <div class="icon">🚚</div>
          <h2>Ask anything about your logistics data</h2>
          <p>
            This agent queries a SQLite database of <strong>5 000 orders</strong> across
            15 Indian cities and 10 delivery partners.<br />
            Try: <code>Which city had the most delays last week?</code>
          </p>
        </div>
      </div>

      <div class="input-bar">
        <textarea id="question" rows="1" placeholder="Ask a logistics question…" autocomplete="off"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const welcomeEl = document.getElementById('welcome');
    const questionEl = document.getElementById('question');
    const sendBtn = document.getElementById('send-btn');

    // ── Load sample questions from API ──────────────────────────────
    async function loadSamples() {
      try {
        const res = await fetch('/sample-questions');
        const data = await res.json();
        const list = document.getElementById('sample-list');
        list.innerHTML = '';
        data.questions.forEach(q => {
          const btn = document.createElement('button');
          btn.className = 'sample-btn';
          btn.textContent = q;
          btn.onclick = () => { questionEl.value = q; questionEl.focus(); };
          list.appendChild(btn);
        });
      } catch (e) {
        console.warn('Could not load sample questions', e);
      }
    }
    loadSamples();

    // ── Auto-grow textarea ───────────────────────────────────────────
    questionEl.addEventListener('input', () => {
      questionEl.style.height = 'auto';
      questionEl.style.height = Math.min(questionEl.scrollHeight, 120) + 'px';
    });

    // ── Send on Enter (Shift+Enter = newline) ────────────────────────
    questionEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener('click', sendMessage);

    // ── Core send function ────────────────────────────────────────────
    async function sendMessage() {
      const text = questionEl.value.trim();
      if (!text) return;

      hideWelcome();
      appendMessage('user', text);
      questionEl.value = '';
      questionEl.style.height = 'auto';
      sendBtn.disabled = true;

      const thinkingId = appendThinking();

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text }),
        });

        const data = await res.json();
        removeThinking(thinkingId);

        if (!res.ok) {
          appendMessage('bot', `⚠️ Error: ${data.detail || 'Something went wrong.'}`, null);
        } else {
          appendMessage('bot', data.answer, data.time_taken_s);
        }
      } catch (err) {
        removeThinking(thinkingId);
        appendMessage('bot', '⚠️ Could not reach the server. Is it running?', null);
      } finally {
        sendBtn.disabled = false;
        questionEl.focus();
      }
    }

    function hideWelcome() {
      if (welcomeEl) { welcomeEl.style.display = 'none'; }
    }

    function appendMessage(role, text, timeTaken) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      if (role === 'bot' && timeTaken !== null && timeTaken !== undefined) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `⏱ ${timeTaken}s`;
        bubble.appendChild(meta);
      }

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    let thinkingCounter = 0;
    function appendThinking() {
      const id = ++thinkingCounter;
      const msg = document.createElement('div');
      msg.className = 'msg bot thinking';
      msg.dataset.thinkingId = id;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = `
      <div class="dot-row">
        <span></span><span></span><span></span>
      </div>
      <span class="thinking-label">Querying database…</span>
    `;

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return id;
    }

    function removeThinking(id) {
      const el = messagesEl.querySelector(`[data-thinking-id="${id}"]`);
      if (el) el.remove();
    }
  </script>
</body>

</html>
